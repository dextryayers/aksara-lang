[workspace]
resolver = "2"
members = [
    "crates/aksara-ast",
    "crates/aksara-diagnostik",
    "crates/aksara-lexer",
    "crates/aksara-parser",
    "crates/aksara-cli",
]
exclude = ["uji/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/aksara-lang/aksara"
authors = ["Aksara Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
